name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: Build macOS Apple Silicon unsigned
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build unsigned Tauri app
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          set -euxo pipefail
          pnpm tauri build \
            --target aarch64-apple-darwin \
            --bundles app,dmg \
            --config '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-"}}}'

      - name: Prepare release assets
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p release-assets

          BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle"
          APP_PATH=$(find "$BUNDLE_DIR/macos" -maxdepth 1 -name "*.app" -type d | head -1 || true)
          DMG_PATH=$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name "*.dmg" -type f | head -1 || true)

          if [ -z "$APP_PATH" ]; then
            echo "No .app found under $BUNDLE_DIR/macos" >&2
            exit 1
          fi
          if [ -z "$DMG_PATH" ]; then
            echo "No .dmg found under $BUNDLE_DIR/dmg" >&2
            exit 1
          fi

          ZIP_NAME="juhe365-switch-${VERSION}-macOS-arm64.zip"
          DMG_NAME="juhe365-switch-${VERSION}-macOS-arm64.dmg"

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release-assets/$ZIP_NAME"
          cp "$DMG_PATH" "release-assets/$DMG_NAME"
          shasum -a 256 "release-assets/$ZIP_NAME" "release-assets/$DMG_NAME" > release-assets/SHA256SUMS.txt

          ls -la release-assets

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: juhe365-switch ${{ github.ref_name }}
          prerelease: false
          body: |
            ## juhe365-switch ${{ github.ref_name }}

            当前先发布 macOS Apple Silicon / M 系列芯片版本。

            ### 下载

            - `juhe365-switch-${{ github.ref_name }}-macOS-arm64.dmg`
            - `juhe365-switch-${{ github.ref_name }}-macOS-arm64.zip`
            - `SHA256SUMS.txt`

            ### 说明

            - 本版本未进行 Apple 代码签名和公证。
            - macOS 首次打开可能提示无法验证开发者，请在系统设置中手动允许打开。
            - 后续可继续补充 Windows、Linux、macOS Intel / Universal 等版本。
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
