name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64 unsigned
            os: windows-2022
            platform: windows
            asset_arch: x64
            rust_target: x86_64-pc-windows-msvc
          - label: Linux x64 unsigned
            os: ubuntu-22.04
            platform: linux
            asset_arch: x64
            rust_target: ""
          - label: macOS Intel unsigned
            os: macos-13
            platform: macos
            asset_arch: x64
            rust_target: x86_64-apple-darwin
          - label: macOS Apple Silicon unsigned
            os: macos-14
            platform: macos
            asset_arch: arm64
            rust_target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        if: matrix.rust_target != ''
        shell: bash
        run: rustup target add "${{ matrix.rust_target }}"

      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            patchelf \
            rpm \
            xdg-utils \
            libssl-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Windows app
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm tauri build `
            --target ${{ matrix.rust_target }} `
            --bundles msi `
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Build Linux app
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euxo pipefail
          pnpm tauri build \
            --bundles appimage,deb,rpm \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Build macOS app
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          set -euxo pipefail
          pnpm tauri build \
            --target "${{ matrix.rust_target }}" \
            --bundles app,dmg \
            --config '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-"}}}'

      - name: Prepare Windows assets
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          $bundleRoot = 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle'
          $msi = Get-ChildItem -Path $bundleRoot -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $msi) { throw "No Windows MSI found under $bundleRoot" }
          Copy-Item $msi.FullName "release-assets/juhe365-switch-$version-Windows-x64.msi"

          $exe = Get-ChildItem -Path 'src-tauri/target/x86_64-pc-windows-msvc/release' -Filter juhe365-switch.exe -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -ne $exe) {
            $portableDir = 'release-assets/juhe365-switch-portable'
            New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
            Copy-Item $exe.FullName $portableDir
            @('portable=true') | Set-Content -Path "$portableDir/portable.ini" -Encoding UTF8
            Compress-Archive -Path "$portableDir/*" -DestinationPath "release-assets/juhe365-switch-$version-Windows-x64-portable.zip" -Force
            Remove-Item -Recurse -Force $portableDir
          }

          Get-ChildItem release-assets

      - name: Prepare Linux assets
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euxo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p release-assets

          appimage=$(find src-tauri/target/release/bundle -name "*.AppImage" -type f | head -1 || true)
          deb=$(find src-tauri/target/release/bundle -name "*.deb" -type f | head -1 || true)
          rpm=$(find src-tauri/target/release/bundle -name "*.rpm" -type f | head -1 || true)

          [ -n "$appimage" ] && cp "$appimage" "release-assets/juhe365-switch-${version}-Linux-x64.AppImage"
          [ -n "$deb" ] && cp "$deb" "release-assets/juhe365-switch-${version}-Linux-x64.deb"
          [ -n "$rpm" ] && cp "$rpm" "release-assets/juhe365-switch-${version}-Linux-x64.rpm"

          test -n "$(find release-assets -maxdepth 1 -type f)"
          ls -la release-assets

      - name: Prepare macOS assets
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euxo pipefail
          version="${GITHUB_REF_NAME}"
          arch="${{ matrix.asset_arch }}"
          bundle_dir="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          mkdir -p release-assets

          app_path=$(find "$bundle_dir/macos" -maxdepth 1 -name "*.app" -type d | head -1 || true)
          dmg_path=$(find "$bundle_dir/dmg" -maxdepth 1 -name "*.dmg" -type f | head -1 || true)

          if [ -z "$app_path" ]; then
            echo "No .app found under $bundle_dir/macos" >&2
            exit 1
          fi
          if [ -z "$dmg_path" ]; then
            echo "No .dmg found under $bundle_dir/dmg" >&2
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent "$app_path" "release-assets/juhe365-switch-${version}-macOS-${arch}.zip"
          cp "$dmg_path" "release-assets/juhe365-switch-${version}-macOS-${arch}.dmg"
          ls -la release-assets

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}-${{ matrix.asset_arch }}
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euxo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: juhe365-switch ${{ github.ref_name }}
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            ## juhe365-switch ${{ github.ref_name }}

            本版本发布 Windows、macOS、Linux 安装包。

            ### 下载

            - Windows x64: `juhe365-switch-${{ github.ref_name }}-Windows-x64.msi`
            - Windows x64 Portable: `juhe365-switch-${{ github.ref_name }}-Windows-x64-portable.zip`
            - macOS Apple Silicon / M 系列: `juhe365-switch-${{ github.ref_name }}-macOS-arm64.dmg` / `.zip`
            - macOS Intel: `juhe365-switch-${{ github.ref_name }}-macOS-x64.dmg` / `.zip`
            - Linux x64: `juhe365-switch-${{ github.ref_name }}-Linux-x64.AppImage` / `.deb` / `.rpm`
            - 校验文件: `SHA256SUMS.txt`

            ### 说明

            - 本版本安装包未进行商业代码签名。
            - macOS 版本未进行 Apple 公证，首次打开可能提示无法验证开发者，请在系统设置中手动允许打开。
            - Linux arm64 可在后续单独补充，避免影响本次主流系统发布。
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
